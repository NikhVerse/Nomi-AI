<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Obsidian to Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Left Stem Gradient -->
    <linearGradient id="leftStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Diagonal Fold Gradient -->
    <linearGradient id="diagonal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Right Stem Gradient -->
    <linearGradient id="rightStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>

    <!-- Sparkle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle with Shadow & Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ambientGlow)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Monogram N Glyph with Prismatic Geometry -->
  <!-- Left Column -->
  <path d="M19 44V20C19 18.8954 19.8954 18 21 18H22C23.1046 18 24 18.8954 24 20V44C24 45.1046 23.1046 46 22 46H21C19.8954 46 19 45.1046 19 44Z" fill="url(#leftStem)" />

  <!-- Diagonal Bridge -->
  <path d="M22 20L41 42C41.7 42.8 43 42.3 43 41.2V20" stroke="url(#diagonal)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Column -->
  <path d="M40 44V20C40 18.8954 40.8954 18 42 18H43C44.1046 18 45 18.8954 45 20V44C45 45.1046 44.1046 46 43 46H42C40.8954 46 40 45.1046 40 44Z" fill="url(#rightStem)" />

  <!-- AI Neural Sparkle at Top Right -->
  <g filter="url(#glow)">
    <circle cx="48.5" cy="15.5" r="3.5" fill="#38bdf8" />
    <path d="M48.5 10V21M43 15.5H54" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>